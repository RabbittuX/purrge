<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel-2:#fafbfc;--ink:#14171c;--ink-2:#3d434d;--sub:#6b7280;--mute:#9aa1ad;--line:#e9ebef;--line-2:#f1f2f5;
  --blue:#2f6bff;--blue-soft:#eaf0ff;--green:#12a374;--green-soft:#e6f6f0;--amber:#e08a00;--amber-soft:#fff3dc;--red:#e5484d;--red-soft:#fdecec;--gray-soft:#f1f2f4;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);--sh-2:0 1px 2px rgba(16,24,40,.04),0 12px 32px -8px rgba(16,24,40,.10);--sh-3:0 24px 64px -12px rgba(16,24,40,.28);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#171a20;--panel-2:#1b1f26;--ink:#eef0f4;--ink-2:#c9ced6;--sub:#9aa2ae;--mute:#6d7480;--line:#262a32;--line-2:#20242b;
  --blue-soft:#18233d;--green-soft:#11291f;--amber-soft:#2e2412;--red-soft:#321a1c;--gray-soft:#20242b;
  --sh-1:none;--sh-2:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px -8px rgba(0,0,0,.6);--sh-3:0 24px 64px -12px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 150px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.num{font-variant-numeric:tabular-nums}

/* 顶栏 */
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.brand{width:46px;height:46px;border-radius:12px;box-shadow:0 8px 20px -8px rgba(120,70,40,.45)}
.top h1 .by{font-size:12.5px;font-weight:600;color:var(--mute);margin-left:4px;letter-spacing:0}.top h1{font-size:20px;margin:0;letter-spacing:-.01em}.top p{margin:1px 0 0;color:var(--sub);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ai{background:var(--blue-soft);color:var(--blue)}.pill.rule{background:var(--gray-soft);color:var(--sub)}
.iconbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;box-shadow:var(--sh-1);font-weight:600;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--mute)}.iconbtn svg{width:16px;height:16px}

/* 概览 */
.hero{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
.ringbox{padding:22px;display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:216px;height:216px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c small{color:var(--sub);font-size:12px}.ring .c b{font-size:30px;letter-spacing:-.02em;line-height:1.15}.ring .c span{font-size:12px;color:var(--sub);line-height:1.45;margin-top:2px}
.legend{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.side{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{padding:16px 18px}.kpi small{display:block;color:var(--sub);font-size:12.5px;margin-bottom:4px}
.kpi b{font-size:26px;letter-spacing:-.02em;line-height:1.1}.kpi em{display:block;font-style:normal;font-size:12px;margin-top:6px;color:var(--mute)}
.kpi.bad b{color:var(--red)}.kpi.good b{color:var(--green)}
.insight{padding:18px 20px;display:flex;gap:14px;align-items:flex-start;background:linear-gradient(120deg,var(--blue-soft),var(--panel) 70%)}
.insight .spark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center}
.insight .spark svg{width:18px;height:18px}
.insight h3{margin:0 0 2px;font-size:13px;color:var(--blue);font-weight:700}.insight p{margin:0;color:var(--ink-2);font-size:14.5px}
.status{padding:12px 16px;border-radius:var(--r-md);font-size:13px;display:flex;gap:10px;align-items:center}
.status.bad{background:var(--red-soft);color:var(--red)}.status.good{background:var(--green-soft);color:var(--green)}
.status b{font-weight:700}

/* 分区 */
.sec{margin-top:18px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;user-select:none}
.badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.badge svg{width:19px;height:19px}
.primary .badge{background:var(--green-soft);color:var(--green)}.optional .badge{background:var(--amber-soft);color:var(--amber)}.keep .badge{background:var(--gray-soft);color:var(--sub)}
.sec-h h2{margin:0;font-size:16.5px;letter-spacing:-.01em}.sec-h h2 span{color:var(--mute);font-weight:500;margin-left:6px}
.sec-h p{margin:1px 0 0;color:var(--sub);font-size:12.5px}
.sec-h .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sec-h .total{font-weight:750;font-size:16px}
.chev{width:18px;height:18px;color:var(--mute);transition:transform .2s}.collapsed .chev{transform:rotate(-90deg)}
.link{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:7px}.link:hover{background:var(--blue-soft)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--gray-soft);margin:0 22px 8px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-size:12.5px;color:var(--sub);cursor:pointer;font-weight:600}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.collapsed .body{display:none}
.list{padding:0 10px 10px}

/* 条目 */
.item{display:grid;grid-template-columns:26px 40px 1fr auto;gap:14px;align-items:center;padding:12px 12px;border-radius:var(--r-md);cursor:pointer;transition:background .12s}
.item+.item{border-top:1px solid var(--line-2)}
.item:hover{background:var(--panel-2)}
.item.sel{background:color-mix(in srgb,var(--green-soft) 55%,transparent)}
.optional .item.sel{background:color-mix(in srgb,var(--amber-soft) 65%,transparent)}
.item.covered{opacity:.45}
.keep .item{cursor:default;grid-template-columns:40px 1fr auto}
.ck{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--mute);display:grid;place-items:center;transition:all .12s;background:var(--panel)}
.ck svg{width:14px;height:14px;opacity:0}
.sel .ck{background:var(--green);border-color:var(--green)}.optional .sel .ck{background:var(--amber);border-color:var(--amber)}.sel .ck svg{opacity:1}
.ico{width:40px;height:40px;border-radius:11px;background:var(--gray-soft);display:grid;place-items:center;color:var(--ink-2)}
.ico svg{width:20px;height:20px}
.it-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:650;font-size:14.5px}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--gray-soft);color:var(--sub)}
.tag.g{background:var(--green-soft);color:var(--green)}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.r{background:var(--red-soft);color:var(--red)}
.it-r{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.it-p{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--mute);font-size:12px}
.it-p .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
.it-p .path{cursor:pointer;border-radius:5px;padding:0 3px;margin-left:-3px}.it-p .path:hover{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.reveal{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:11.5px;font-weight:600;padding:1px 9px 1px 7px;border-radius:7px;cursor:pointer;white-space:nowrap;opacity:.75;transition:all .12s}
.reveal svg{width:12px;height:12px}.item:hover .reveal{opacity:1}.reveal:hover{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.it-s{text-align:right;min-width:110px}.it-s b{font-size:15.5px;letter-spacing:-.01em}
.meter{height:4px;border-radius:4px;background:var(--line-2);margin-top:7px;overflow:hidden}.meter i{display:block;height:100%;border-radius:4px}
.primary .meter i{background:var(--green)}.optional .meter i{background:var(--amber)}.keep .meter i{background:var(--mute)}
.empty{padding:26px;text-align:center;color:var(--mute)}

/* 底栏 */
.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(1032px,calc(100% - 32px));display:flex;align-items:center;gap:18px;padding:14px 16px 14px 22px;border-radius:18px;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);box-shadow:var(--sh-3);z-index:5}
.dock .d1 b{font-size:19px;letter-spacing:-.01em}.dock .d1 small{display:block;color:var(--sub);font-size:12.5px}
.dock .goal{flex:1;max-width:260px}
.goal .gb{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.goal .gb i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:6px;transition:width .3s}
.goal small{display:block;color:var(--sub);font-size:12px;margin-top:5px}
.btn{border:0;border-radius:12px;height:44px;padding:0 22px;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .08s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{margin-left:auto;background:var(--ink);color:var(--panel);box-shadow:0 8px 20px -8px rgba(20,23,28,.6)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:0 10px 24px -8px rgba(18,163,116,.65)}
.btn.ghost{background:var(--gray-soft);color:var(--ink)}

/* 弹层 */
.scrim{position:fixed;inset:0;background:rgba(12,14,18,.38);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(520px,calc(100% - 32px));max-height:86vh;overflow:auto;padding:26px;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.2,.8,.2,1);z-index:21;border-radius:22px}
.dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}.dialog .lead{color:var(--sub);margin:0 0 16px}
.dl{display:grid;gap:10px}
.dl .r{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--panel-2);border:1px solid var(--line-2)}
.dl .r .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dl .r b{display:block}.dl .r span{color:var(--sub);font-size:13px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.result-hero{text-align:center;padding:6px 0 14px}
.result-hero .okc{width:58px;height:58px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}
.result-hero .okc svg{width:30px;height:30px}
.result-hero b{display:block;font-size:44px;letter-spacing:-.03em;color:var(--green);line-height:1.1}
.result-hero span{color:var(--sub)}
.rr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 2px;border-top:1px solid var(--line-2);font-size:13.5px;align-items:start}
.rr small{display:block;color:var(--sub);font-size:12px}
.rr .st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;margin-top:1px}

/* 设置抽屉 */
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(400px,calc(100% - 24px));padding:24px;z-index:21;border-radius:22px;transform:translateX(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:auto}
.drawer.show{transform:none}
.drawer h3{margin:0;font-size:19px}.drawer .lead{color:var(--sub);margin:4px 0 18px;font-size:13px}
.field{padding:16px 0;border-top:1px solid var(--line-2)}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:10px}
.field label b{font-size:22px;color:var(--blue);letter-spacing:-.02em}
.field p{margin:8px 0 0;color:var(--sub);font-size:12.5px}
input[type=range]{width:100%;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,10%),var(--line) var(--p,10%));outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:6px}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:11px;background:var(--gray-soft);gap:2px}
.segc button{border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.segc button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.drawer .actions{margin-top:auto;padding-top:18px}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;transition:all .25s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(1turn)}}
@media (max-width:860px){.hero{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}.item{grid-template-columns:24px 36px 1fr}.it-s{grid-column:3;text-align:left}.dock .goal{display:none}}
</style>
</head>

</div>

<div class="dock">
  <div class="d1"><b class="num" id="d-count">已选 0 项</b><small id="d-sub">首要清理会直接删除；需要你决定的默认移到废纸篓</small></div>
  <div class="goal"><div class="gb"><i id="d-goal"></i></div><small id="d-goal-t"></small></div>
  <button class="btn primary" id="go" disabled>确认清理</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="panel dialog" id="dlg-confirm">
  <h3>确认清理？</h3><p class="lead" id="cf-lead"></p>
  <div class="dl" id="cf-list"></div>
  <div class="actions"><button class="btn ghost" data-close>再看看</button><button class="btn green" id="cf-go">确认清理</button></div>
</div>
<div class="panel dialog" id="dlg-done">
  <div class="result-hero"><div class="okc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <b class="num" id="rs-big">0 B</b><span id="rs-sub"></span></div>
  <div id="rs-list"></div>
  <div class="actions"><button class="btn primary" id="rs-close" style="margin-left:0">完成</button></div>
</div>
<div class="panel drawer" id="drawer">
  <h3>设置</h3><p class="lead">保存后立即生效，后台监控下次检查时按新设置执行。</p>
  <div class="field"><label>提醒阈值 <b class="num" id="st-th-v"></b></label>
    <input type="range" id="st-th" min="5" max="100" step="1"><div class="ticks"><span>5 GB</span><span>25</span><span>50</span><span>75</span><span>100 GB</span></div>
    <p>剩余空间低于这个值时，后台会弹窗提醒你扫描。</p></div>
  <div class="field"><label>检查频率</label><div class="segc" data-key="intervalMinutes"><button data-v="15">15 分钟</button><button data-v="30">30 分钟</button><button data-v="60">1 小时</button><button data-v="180">3 小时</button></div></div>
  <div class="field"><label>提醒冷却</label><div class="segc" data-key="cooldownHours"><button data-v="2">2 小时</button><button data-v="6">6 小时</button><button data-v="24">1 天</button></div><p>提醒过一次后，这段时间内不再打扰。</p></div>
  <div class="field"><label>"需要你决定"的项目</label><div class="segc" data-key="optionalAction"><button data-v="trash">移到废纸篓</button><button data-v="delete">直接删除</button></div><p id="oa-tip"></p></div>
  <div class="actions"><button class="btn ghost" data-close>取消</button><button class="btn primary" id="st-save" style="margin-left:0">保存设置</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const token = new URLSearchParams(location.search).get("token");
const api = (p, body) => fetch(p, { method: body ? "POST" : "GET", headers: { "X-DG-Token": token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }).then((r) => r.json());
const $ = (s) => document.querySelector(s);
const GB = 1073741824;
const fmt = (n) => { n = +n || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i >= 3 ? n.toFixed(1) : Math.round(n)) + " " + u[i]; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const home = (p) => p.replace(/^\/Users\/[^/]+/, "~");
const I = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  broom: '<path d="M14 4l6 6M12 6l6 6-7 7H6v-5z"/><path d="M6 14l4 4"/>',
  hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V13c0 4-2.5 7-6 7s-5-1.5-6.5-4L3 12.5a1.5 1.5 0 0 1 2.5-1.6L8 13"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/>',
  code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  film: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  pkg: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
};
const svg = (k, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[k] || ""}</svg>`;
function iconFor(it) {
  if (it.ruleId === "user-trash" || it.ruleId === "tool-trash") return "trash";
  if (it.kind === "large-file") return /\.(mov|mp4|m4v|avi|mkv)$/i.test(it.path) ? "film" : /\.(dmg|pkg|zip)$/i.test(it.path) ? "pkg" : "file";
  if (it.kind === "large-dir") return "folder";
  return { "浏览器": "globe", "开发工具": "code", "AI 工具": "spark", "系统": "gear", "用户文件": "folder" }[it.category] || "box";
}

let R, CFG, FREE, TOTAL, sel = new Set(), seg = "全部", collapsed = { keep: true };
const days = (it) => (it.lastUsed ? Math.floor((Date.now() / 1000 - it.lastUsed) / 86400) : null);
const coveredBy = (it) => [...sel].some((id) => { const o = byId[id]; return o && o.id !== it.id && it.path.startsWith(o.path + "/"); });
let byId = {};
const gainBytes = () => R.items.reduce((t, it) => t + (sel.has(it.id) && !coveredBy(it) ? it.sizeBytes : 0), 0);

function itemHtml(it, max) {
  const d = days(it), tags = [];
  if (it.tier === "primary" && it.regenerable) tags.push('<span class="tag g">可重建</span>');
  if ((it.appsRunning || []).length) tags.push(`<span class="tag a">先退出 ${esc(it.appsRunning.join("、"))}</span>`);
  if ((it.kind === "large-file" || it.kind === "large-dir") && d != null) tags.push(`<span class="tag ${d > 90 ? "a" : ""}">${d === 0 ? "今天用过" : d + " 天未使用"}</span>`);
  if (it.tier === "optional") tags.push(`<span class="tag">${it.ruleId === "user-trash" ? "清空" : CFG.optionalAction === "delete" ? "直接删除" : "移到废纸篓"}</span>`);
  if (it.scanLimited) tags.push('<span class="tag r">部分无权限读取</span>');
  const keep = it.tier === "keep", s = sel.has(it.id);
  return `<div class="item ${s ? "sel" : ""} ${!keep && coveredBy(it) ? "covered" : ""}" data-id="${it.id}">
    ${keep ? "" : `<div class="ck">${svg("check", 3).replace('stroke="currentColor"', 'stroke="#fff"')}</div>`}
    <div class="ico">${svg(iconFor(it))}</div>
    <div style="min-width:0"><div class="it-t">${esc(it.title || it.name)} ${tags.join("")}</div>
      <div class="it-r">${esc(it.reason)}</div>
      <div class="it-p"><span class="mono path" data-reveal="${it.id}" title="${it.kind === "large-file" ? "在访达中定位这个文件" : "在访达中打开这个文件夹"}">${esc(home(it.path))}</span><button class="reveal" data-reveal="${it.id}">${svg(it.kind === "large-file" ? "file" : "folder", 2)}${it.kind === "large-file" ? "在访达中定位" : "打开文件夹"}</button></div></div>
    <div class="it-s"><b class="num">${fmt(it.sizeBytes)}</b><div class="meter"><i style="width:${Math.max(2, (it.sizeBytes / max) * 100)}%"></i></div></div></div>`;
}

function section(key, title, desc, icon, items, extra) {
  const total = items.reduce((a, b) => a + b.sizeBytes, 0), max = Math.max(...items.map((x) => x.sizeBytes), 1);
  const allSel = items.length && items.every((x) => sel.has(x.id));
  return `<div class="panel sec ${key} ${collapsed[key] ? "collapsed" : ""}">
    <div class="sec-h" data-toggle="${key}"><div class="badge">${svg(icon, 2)}</div>
      <div><h2>${title}<span>${items.length} 项</span></h2><p>${desc}</p></div>
      <div class="right">${key !== "keep" && items.length ? `<button class="link" data-all="${key}">${allSel ? "全不选" : "全选"}</button>` : ""}<span class="total num">${fmt(total)}</span><span class="chev">${svg("chev", 2)}</span></div></div>
    <div class="body">${extra || ""}<div class="list">${items.length ? items.map((it) => itemHtml(it, max)).join("") : '<div class="empty">没有这类项目</div>'}</div></div></div>`;
}

function render() {
  const g = { primary: [], optional: [], keep: [] };
  R.items.forEach((it) => g[it.tier || "optional"].push(it));
  const cats = ["全部", ...new Set(g.optional.map((x) => x.category).filter(Boolean))];
  const opt = g.optional.filter((x) => seg === "全部" || x.category === seg);
  $("#sections").innerHTML =
    section("primary", "首要清理", "可以自动重建的缓存，删除不会丢数据，已默认勾选", "broom", g.primary) +
    section("optional", "需要你决定", "你的文件或重建代价较大的内容，只处理你勾选的", "hand", opt,
      cats.length > 2 ? `<div class="seg">${cats.map((c) => `<button class="${c === seg ? "on" : ""}" data-seg="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "") +
    section("keep", "不会清理", "受保护、正在使用或删除会丢数据的内容，仅供了解", "lock", g.keep);
  totals();
}

function totals() {
  const gain = gainBytes(), used = TOTAL - FREE, th = CFG.thresholdGB * GB, after = FREE + gain;
  const C = 2 * Math.PI * 80, uf = used / TOTAL, gf = gain / TOTAL;
  const au = $("#arc-used"), ag = $("#arc-gain");
  au.style.strokeDasharray = `${C * Math.max(0, uf - gf)} ${C}`;
  ag.style.strokeDasharray = `${C * gf} ${C}`; ag.style.strokeDashoffset = `${-C * Math.max(0, uf - gf)}`;
  const ang = (1 - th / TOTAL) * 360; $("#th").setAttribute("transform", `rotate(${ang + 90} 100 100)`);
  $("#ring-free").textContent = fmt(FREE); $("#ring-of").innerHTML = `共 ${fmt(TOTAL)}<br>阈值 ${CFG.thresholdGB} GB`;
  $("#k-free b").textContent = fmt(FREE); $("#k-free").className = "panel kpi " + (FREE < th ? "bad" : "");
  $("#k-free-em").textContent = FREE < th ? `低于阈值 ${fmt(th - FREE)}` : "高于阈值";
  $("#k-gain").textContent = fmt(gain); $("#k-gain-em").textContent = `已选 ${sel.size} 项`;
  $("#k-after b").textContent = fmt(after); $("#k-after").className = "panel kpi " + (after >= th ? "good" : "bad");
  $("#k-after-em").textContent = after >= th ? "回到阈值以上" : `还差 ${fmt(th - after)}`;
  const st = $("#status");
  st.className = "status " + (after >= th ? "good" : "bad");
  st.innerHTML = after >= th ? `<b>✓</b> 清理已勾选的内容后，剩余空间将回到 ${CFG.thresholdGB} GB 以上` : `<b>!</b> 当前勾选还不够，距离阈值还差 <b>${fmt(th - after)}</b>，可以在"需要你决定"里再选一些`;
  $("#d-count").textContent = `已选 ${sel.size} 项 · ${fmt(gain)}`;
  const need = Math.max(1, th - FREE); $("#d-goal").style.width = Math.min(100, (gain / need) * 100) + "%";
  $("#d-goal-t").textContent = FREE >= th ? "当前已高于阈值" : after >= th ? "已足够回到阈值以上" : `达到阈值还差 ${fmt(th - after)}`;
  $("#go").disabled = !sel.size;
}

function toast(t, ms = 1800) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), ms); }
function open(id) { $("#scrim").classList.add("show"); $(id).classList.add("show"); }
function closeAll() { document.querySelectorAll(".show").forEach((e) => e.classList.remove("show")); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-reveal],[data-all],[data-seg],[data-toggle],.item,[data-close],.segc button,#scrim");
  if (!t) return;
  if (t.dataset.reveal) { e.stopPropagation(); api("/api/reveal", { id: t.dataset.reveal }).then((r) => toast(r.ok ? (r.opened === "folder" ? "已在访达中打开文件夹" : "已在访达中定位文件") : "这个位置已经不存在了")); return; }
  if (t.dataset.all) { e.stopPropagation(); const items = R.items.filter((x) => x.tier === t.dataset.all); const all = items.every((x) => sel.has(x.id)); items.forEach((x) => (all ? sel.delete(x.id) : sel.add(x.id))); render(); return; }
  if (t.dataset.seg) { seg = t.dataset.seg; render(); return; }
  if (t.dataset.toggle) { collapsed[t.dataset.toggle] = !collapsed[t.dataset.toggle]; render(); return; }
  if (t.classList.contains("item")) { const it = byId[t.dataset.id]; if (it.tier === "keep") return; sel.has(it.id) ? sel.delete(it.id) : sel.add(it.id); render(); return; }
  if (t.matches(".segc button")) { t.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === t)); if (t.parentElement.dataset.key === "optionalAction") oaTip(t.dataset.v); return; }
  if (t.dataset.close != null || t.id === "scrim") closeAll();
});

$("#go").onclick = () => {
  const items = R.items.filter((x) => sel.has(x.id) && !coveredBy(x));
  const p = items.filter((x) => x.tier === "primary"), o = items.filter((x) => x.tier === "optional");
  const apps = [...new Set(items.flatMap((x) => x.appsRunning || []))];
  $("#cf-lead").textContent = `共 ${items.length} 项，预计释放 ${fmt(gainBytes())}。`;
  $("#cf-list").innerHTML =
    (p.length ? `<div class="r"><span class="dot" style="background:var(--green)"></span><div><b>首要清理 ${p.length} 项 · ${fmt(p.reduce((a, b) => a + b.sizeBytes, 0))}</b><span>直接删除，相关软件会自动重建</span></div></div>` : "") +
    (o.length ? `<div class="r"><span class="dot" style="background:var(--amber)"></span><div><b>需要你决定 ${o.length} 项 · ${fmt(o.reduce((a, b) => a + b.sizeBytes, 0))}</b><span>${CFG.optionalAction === "delete" ? "直接删除，无法找回" : "移到废纸篓，可以找回；清空废纸篓后才真正释放空间"}</span></div></div>` : "") +
    (apps.length ? `<div class="r"><span class="dot" style="background:var(--red)"></span><div><b>建议先退出：${esc(apps.join("、"))}</b><span>正在运行时清理它的缓存，可能有少量文件删不掉</span></div></div>` : "");
  open("#dlg-confirm");
};

function countUp(el, to) { const t0 = performance.now(); const step = (t) => { const p = Math.min(1, (t - t0) / 900); el.textContent = fmt(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
$("#cf-go").onclick = async () => {
  const b = $("#cf-go"); b.innerHTML = '<span class="spin"></span>正在清理…'; b.disabled = true;
  let out;
  try { out = await api("/api/clean", { ids: [...sel] }); } catch (e) { out = { error: "清理请求中断了" }; }
  closeAll();
  if (out.error || !Array.isArray(out.results)) {   // 别让按钮一直转圈；部分项目可能已经处理，提示重新扫描确认
    b.innerHTML = "确认清理"; b.disabled = false;
    toast((out.error || "清理失败") + "。部分项目可能已经处理，请重新扫描确认后再试", 8000);
    return;
  }
  const C = { deleted: ["var(--green)", "✓"], trashed: ["var(--blue)", "↗"], partial: ["var(--amber)", "!"], failed: ["var(--red)", "×"], skipped: ["var(--mute)", "–"], gone: ["var(--mute)", "–"] };
  const trashed = out.results.reduce((a, r) => a + (r.trashedBytes || 0), 0);
  $("#rs-sub").textContent = `剩余空间 ${fmt(out.freeBefore)} → ${fmt(out.freeAfter)}` + (trashed ? ` · 另有 ${fmt(trashed)} 在废纸篓，清空后释放` : "");
  $("#rs-list").innerHTML = out.results.map((r) => { const it = byId[r.id] || {}; const c = C[r.status] || C.skipped;
    return `<div class="rr"><span class="st" style="background:${c[0]}">${c[1]}</span><div>${esc(it.title || home(r.path || ""))}${r.message ? `<small>${esc(r.message)}</small>` : ""}</div><b class="num">${r.freedBytes ? fmt(r.freedBytes) : r.trashedBytes ? "废纸篓 " + fmt(r.trashedBytes) : ""}</b></div>`; }).join("");
  open("#dlg-done"); countUp($("#rs-big"), out.freedBytes);
};
$("#rs-close").onclick = () => { api("/api/close", {}); document.body.innerHTML = `<div class="wrap" style="display:grid;place-items:center;min-height:80vh"><div class="panel" style="padding:44px 52px;text-align:center"><div class="result-hero"><div class="okc">${svg("check", 2.6)}</div></div><h2 style="margin:0 0 6px">已完成</h2><p style="color:var(--sub);margin:0">可以关闭这个页面了。下次空间不足时，Purrge 会再提醒你。</p></div></div>`; };

function oaTip(v) { $("#oa-tip").textContent = v === "delete" ? "立即释放空间，但删除后无法找回。" : "可以从废纸篓找回；清空废纸篓后才会真正释放空间。"; }
function setRange(v) { const r = $("#st-th"); r.max = Math.max(100, Math.ceil(CFG.thresholdGB)); r.value = v; r.style.setProperty("--p", ((v - 5) / (r.max - 5)) * 100 + "%"); $("#st-th-v").textContent = v + " GB"; }
$("#st-th").oninput = (e) => setRange(+e.target.value);
$("#open-settings").onclick = () => {
  setRange(CFG.thresholdGB);
  document.querySelectorAll(".segc").forEach((s) => s.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(CFG[s.dataset.key]))));
  oaTip(CFG.optionalAction); open("#drawer");
};
$("#st-save").onclick = async () => {
  const body = { thresholdGB: +$("#st-th").value };
  document.querySelectorAll(".segc").forEach((s) => { const on = s.querySelector("button.on"); if (on) body[s.dataset.key] = isNaN(+on.dataset.v) ? on.dataset.v : +on.dataset.v; });
  const r = await api("/api/config", body); CFG = r.config; closeAll(); render(); toast("设置已保存");
};

api("/api/review").then((d) => {
  R = d.review; CFG = d.config; FREE = d.freeBytes; TOTAL = d.totalBytes;
  R.items.forEach((x) => (byId[x.id] = x));
  R.items.filter((x) => x.tier === "primary").forEach((x) => sel.add(x.id));
  const t = new Date(R.scannedAt * 1000);
  $("#meta").innerHTML = `扫描于 ${t.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} · ${R.items.length} 项 <span class="pill ${R.judgedBy === "ai" ? "ai" : "rule"}">${R.judgedBy === "ai" ? (R.engine ? R.engine + " 已逐项判断" : "AI 已逐项判断") : "按规则判断"}</span>`;
  if (d.update) $("#meta").innerHTML += ` <span class="pill rule" title="在终端运行 purrge update 更新">有新版本 ${d.update}</span>`;
  if (R.summary) { $("#insight").style.display = ""; $("#insight-t").textContent = R.summary; }
  render();
}).catch(() => { document.body.innerHTML = '<div class="wrap" style="display:grid;place-items:center;min-height:80vh"><div class="panel" style="padding:44px;text-align:center"><h2 style="margin:0 0 6px">这个审查页面已失效</h2><p style="color:var(--sub);margin:0">请重新运行扫描（终端输入 purrge scan）。</p></div></div>'; });
</script>
</body>
</html>
